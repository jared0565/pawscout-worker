name = "pawscout-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "pawscout.activepaw.co.uk", custom_domain = true }
]

# Daily maintenance: cache retention purge, 30-day performance cull, demand-driven refill.
[triggers]
crons = ["17 4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "pawscout"
database_id = "85f80862-0b26-4515-82b6-3408124e3a59"
migrations_dir = "migrations"

[vars]
SHOPIFY_API_KEY = "6bc07cd8a343a4aa2ab4b14a09859310"   # PawScout public app client id
SHOPIFY_APP_URL = "https://pawscout.activepaw.co.uk"
# read_locations + inventory scopes: the stock/price sync reads the primary
# location and writes tracked quantities — without them the nightly sync
# silently no-ops ("no primary location"). Keep in lockstep with the scopes
# configured in the Shopify Dev Dashboard (token exchange grants THOSE).
SHOPIFY_SCOPES = "write_products,read_products,write_publications,read_publications,read_locations,read_inventory,write_inventory"
# SHOPIFY_API_SECRET and PAWSCOUT_MASTER_KEY are secrets (wrangler secret put / .dev.vars), not vars.
