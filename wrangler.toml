name = "pawscout-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "pawscout"
database_id = "local-dev-placeholder"   # real id from `wrangler d1 create pawscout` at Task 13
migrations_dir = "migrations"

[vars]
SHOPIFY_API_KEY = ""        # public app client id (set per-env; empty is fine for local tests)
SHOPIFY_APP_URL = "https://pawscout-worker.example.workers.dev"
SHOPIFY_SCOPES = "write_products,read_products,write_publications,read_publications"
# SHOPIFY_API_SECRET and PAWSCOUT_MASTER_KEY are secrets (wrangler secret put / .dev.vars), not vars.
