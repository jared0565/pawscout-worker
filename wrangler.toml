name = "pawscout-worker"
main = "src/index.ts"
# Raised from 2024-11-01 on 2026-09-18 (deploy-safety phase, task 9). The value
# is deliberately the build date of the runtime the TEST SUITE runs on
# (miniflare 4.20260722 / workerd 1.20260722, via @cloudflare/vitest-pool-workers):
# a newer date would turn on runtime behaviour in production that no local test
# can exercise. Raise it only together with that package, run the full suite,
# deploy to staging, and ship it to production as ITS OWN deploy so a runtime
# behaviour change is never confused with a code change.
compatibility_date = "2026-07-22"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "pawscout.activepaw.co.uk", custom_domain = true }
]

# Persist console logs to Workers Observability. Without this, runtime warnings
# (e.g. "blog draft failed: ...") vanish - the 2026-07-10 OpenRouter-credits
# outage had to be reproduced locally because the error string was unretrievable.
[observability]
enabled = true

# Daily maintenance (17 4) = cache purge, cull, replenish, sweeps.
# Every 15 min = W-FULFIL order pipeline (submit due orders + poll tracking).
[triggers]
crons = ["17 4 * * *", "*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "pawscout"
database_id = "85f80862-0b26-4515-82b6-3408124e3a59"
migrations_dir = "migrations"

[vars]
# Which deployment this is, reported by /healthz (deploy-safety phase,
# 2026-09-18). `vars` are NOT inherited by named environments, so staging sets
# its own value in [env.staging.vars] below.
ENVIRONMENT = "production"
SHOPIFY_API_KEY = "6bc07cd8a343a4aa2ab4b14a09859310"   # PawScout public app client id
SHOPIFY_APP_URL = "https://pawscout.activepaw.co.uk"
# Storefront overseas cards and overseas ghost-click imports (inquiry sourcing
# part D). "off" until the theme shows "Ships from overseas, about N days";
# the storefront query flag overseas=1 is ignored unless this reads "on".
OVERSEAS_STOREFRONT = "off"
# read_locations + inventory scopes: the stock/price sync reads the primary
# location and writes tracked quantities: without them the nightly sync
# silently no-ops ("no primary location"). read_orders + the fulfilment scope
# are for W-FULFIL (receive paid orders, write tracking back). read_shipping +
# write_shipping let the worker manage delivery profiles (origin-aware shipping
# cost, Phase 1). Keep in lockstep with the scopes configured in the Shopify Dev
# Dashboard (token exchange grants THOSE; this var only feeds the legacy OAuth path).
# write_discounts/read_discounts (2026-07-05): voucher-trial automation mints
# partner codes via discountCodeBasicCreate (owner added the scope in the Dev
# Dashboard the same day).
# write_content (2026-07-07): blog-article authoring for the planned content
# channel (owner added it in the Dev Dashboard the same day; token exchange is
# what actually grants it, this var is lockstep hygiene per the note above).
# read/write_online_store_navigation (2026-07-31): archiving a product must
# leave a URL redirect instead of a 404 - urlRedirectCreate and
# urlRedirectDelete both require the WRITE scope. The READ scope is requested
# alongside it because the redirect backfill queries existing redirects to skip
# handles already covered; without that a re-run would mint duplicates, and the
# docs do not state whether write implies read. Until this is granted in the Dev
# Dashboard, archiveProductGuarded refuses every archive with 'missing-scope'
# and the no-movement cull is dormant BY DESIGN (see the 2026-07-31 spec).
SHOPIFY_SCOPES = "write_products,read_products,write_publications,read_publications,read_locations,read_inventory,write_inventory,read_orders,write_merchant_managed_fulfillment_orders,write_draft_orders,read_customers,read_shipping,write_shipping,read_markets,write_markets,read_discounts,write_discounts,write_content,read_online_store_navigation,write_online_store_navigation,read_reports"
# SHOPIFY_API_SECRET and PAWSCOUT_MASTER_KEY are secrets (wrangler secret put / .dev.vars), not vars.

# --- staging (deploy-safety phase, 2026-09-18) --------------------------------
# A place where a deploy can fail harmlessly. NOT connected to any Shopify
# store: it proves that the Worker boots, that migrations apply to an empty
# schema, and that the public routes answer. Deploy it with
# `npm run deploy -- --env staging`, never with a bare `wrangler deploy`.
#
# `routes` and `triggers` are INHERITABLE keys (Cloudflare docs, checked
# 2026-09-18: most keys are inherited by a named environment; only bindings and
# `vars` are not). Both are overridden here ON PURPOSE. Without `routes = []`
# this environment would claim pawscout.activepaw.co.uk, the production custom
# domain; without the empty crons it would run the production jobs (CJ calls,
# LLM spend) against staging every 15 minutes.
[env.staging]
name = "pawscout-worker-staging"
workers_dev = true
routes = []

[env.staging.triggers]
crons = []

[[env.staging.d1_databases]]
binding = "DB"
database_name = "pawscout-staging"
database_id = "5b45383a-a596-48e1-92f2-8817e3b1c54f"
migrations_dir = "migrations"

# Staging has its OWN random SHOPIFY_API_SECRET and PAWSCOUT_MASTER_KEY
# (wrangler secret put ... --env staging). No production key is ever copied
# here, so nothing forged against staging works on production.
[env.staging.vars]
ENVIRONMENT = "staging"
SHOPIFY_API_KEY = "staging-not-connected"
SHOPIFY_APP_URL = "https://pawscout-worker-staging.bmorris0565.workers.dev"
OVERSEAS_STOREFRONT = "off"
SHOPIFY_SCOPES = "read_products"
