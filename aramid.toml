# aramid config for pawscout-worker (Cloudflare Worker, TypeScript, vitest).
#
# This file used to carry a `[tests].command = ["npm", "test"]` workaround plus
# two timeout overrides. None of it is needed any more.
#
# 1. The workaround is obsolete. aramid's detectors were fixed on 2026-07-26
#    (branch feat/detector-stack-fix, merged as 0cb4097): a bare `tests/`
#    directory is no longer a pytest signal, so a TypeScript repo is no longer
#    mis-detected as Python and no longer has `pytest -q` run against it.
#    Re-verified here 2026-07-27 with the shipped code, not the prototype:
#
#      detect_stacks   -> {'js'}     (was {'js', 'python'})
#      detect_tests    -> {'npm'}    (was {'npm', 'pytest'})
#      package manager -> npm        (package-lock.json present, so npm auto-runs)
#
# 2. `[timeouts].pre_push = 300` and `[tests].timeout_s = 300` restated aramid's
#    own defaults verbatim (data/defaults.toml:21 and :35). They added config
#    surface without changing behaviour, so they are gone. Re-add a real value
#    only if a measured run needs one.

schema_version = 1

# Top-level, and it MUST stay above every table header.
#
# An earlier version of this file placed this key after `[timeouts]`, so TOML
# parsed it as `timeouts.bake_started`. `config.load_config` reads it with
# `merged.get("bake_started")` -- a top-level lookup -- so it silently resolved
# to None and `aramid status` reported "bake in progress, day ? (bake_started
# not set in aramid.toml)" while the key sat right there in the file. A quiet
# misparse, not an error.
#
# Dated to when aramid first ran against this repo rather than when this file
# was last edited: the bake measures how long semgrep findings have been
# WARN-only, and that clock started then.
bake_started = "2026-07-25"

# MEASURED, not guessed - which is the condition this file set for re-adding
# these keys ("Re-add a real value only if a measured run needs one", below).
#
# After the 2026-07-28 vitest 2->4 upgrade the suite actually RUNS: 150 files /
# 1861 tests in 275.35s wall clock. Under the old stack it died in seconds
# without executing anything, so the 300s default was never tested against a
# real run. It is now too tight: 275s of tests plus gitleaks, semgrep, typecheck
# and the dependency audit overruns the budget, and aramid records the overrun
# as `tests:tests-failed - tests timeout`, which reads like a broken suite
# rather than a stopwatch problem.
#
# 900s gives the suite headroom on a slower/busier machine without letting a
# genuinely hung run block a push indefinitely. Revisit if the suite grows: the
# number to beat is the "Duration" line from `npx vitest run`.
[timeouts]
pre_push = 900

[tests]
timeout_s = 600

# MEASURED, 2026-09-28. The js_mutation drain consumer runs `npm test` once as
# a baseline before it mutates anything, and aramid gives that run
# mutant_timeout_s x 4 = 480s unless this key says otherwise. The suite no
# longer fits: the drain's own baselines on 2026-09-20 to 09-27 took 375.7,
# 404.5, 424.9, 425.5 and 468.4s, and three more ran out the 480s clock
# (09-27 10:09Z, 14:09Z and 09-28 02:08Z). Three timeouts make the consumer
# give up, and a give-up turns `consumers_healthy` red in `aramid fleet`.
#
# 900s matches `[timeouts].pre_push` above: about twice the slowest measured
# baseline. One drain then spends at most 900s on the baseline plus the two
# 120s mutants the 600s wall budget admits, well inside the drain's 5400s hard
# deadline. Revisit when a drain baseline passes 700s.
#
# Each mutant runs the whole suite. Up to aramid 0.19.x it ran under a flat
# mutant_timeout_s (120s), so every tested mutant timed out (09-20 to 10-02:
# killed 0, timeouts 2; 10-02 10:11Z "no mutant reached a verdict", which
# turned `consumers_healthy` red). aramid 0.20.3 fixed that on its side: a
# mutant now gets max(mutant_timeout_s, 1.5 x the baseline's duration)
# (consumers/js_mutation.py, _MUTANT_BASELINE_FACTOR and `per_mutant`).
#
# wall_budget_s, 2026-10-06. The wall budget covers the WHOLE item: its clock
# starts before the worktree is cut, the baseline runs inside it, and a mutant
# starts only while the elapsed time is still under it. Under the 600s default a
# baseline slower than ~600s (measured: up to 468s, three more past 480s) leaves
# no mutant at all, and "no mutants tested" grades the fleet row red again.
# 1000s sits just above baseline_timeout_s plus worktree setup, so any baseline
# that passes is followed by at least one mutant. A typical item (430s baseline,
# mutants finishing in about the suite's own time) runs two mutants in ~22 min;
# the worst case (budget plus one 1.5 x 900s mutant) ~39 min, inside the drain's
# 5400s hard deadline.
[js_mutation]
baseline_timeout_s = 900
wall_budget_s = 1000

# ---------------------------------------------------------------------------
# ONBOARDING IS COMPLETE (verified 2026-07-31, correcting a stale note here
# that said otherwise as of 2026-07-27).
#
# The precondition this file used to describe -- `aramid check --gate pre-push`
# exiting 0 -- was blocked at the time by the vitest 2.1.9 / pool-workers 0.5.41
# collection failure. That was fixed 2026-07-28 (vitest 4 / pool-workers 0.18,
# commit d739684) and `aramid init` was run afterward: `.git/hooks/pre-commit`,
# `pre-push`, and `post-commit` are all present and aramid-managed, `aramid
# status` reports `registry: registered` with a real baseline (+9 baseline
# findings), and `aramid check --gate pre-push` now exits 0 (0 blocking).
