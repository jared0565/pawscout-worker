# aramid BLOCK-tier suppressions for pawscout-worker.
#
# `aramid override` deliberately REFUSES BLOCK-tier findings ("a local override
# is not permitted"). BLOCK suppression has to live here instead: a committed,
# reviewable file rather than a local ledger event. That asymmetry is the point
# -- a WARN can be waved through by one person on one machine; a BLOCK cannot.
#
# Empty as of 2026-07-31. It previously held two entries scoped to the
# vitest 2.1.9 / @cloudflare/vitest-pool-workers 0.5.41 test-toolchain
# advisories (npm findings e3b37520... and 9af55a5d...), both dev-only and
# unreachable in the deployed Worker. Both were removed here because the
# 2026-07-28 upgrade (vitest -> 4.1.10, pool-workers -> 0.18.8, commit
# d739684) resolved the advisories outright -- verified against
# package-lock.json (vitest 4.1.10, pool-workers ^0.18.8 present) and against
# aramid's own ledger (both findings already `[fixed]`) before deleting, not
# assumed from the suppression reasons alone.
#
# Add a new [[suppress]] entry here only for a genuinely unreachable
# BLOCK-tier finding, with the same standard the deleted entries set: a
# verified-at-source reason, not an inherited one.
