tool = "semgrep"
rule = "owasp-top-ten.a03-injection.javascript-dangerous-function-constructor"
path = "tests/console.test.ts"
reason = "Test compiles the console's own generated inline script (consolePage() output, same process) to catch template-literal syntax errors; no external input, test-only, not in the Worker bundle."

