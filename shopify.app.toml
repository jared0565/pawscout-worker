# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "6bc07cd8a343a4aa2ab4b14a09859310"
application_url = "https://pawscout.activepaw.co.uk/app"
embedded = true
name = "PawScout"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
#
# NOTE (2026-07-31): this list had already drifted from wrangler.toml's
# SHOPIFY_SCOPES, which the comment there asks be kept in lockstep - it was
# missing read_discounts, write_discounts and write_content, all three of which
# were added in the Dev Dashboard on their respective dates. Only the two
# navigation scopes are added here; closing the older drift is left alone
# deliberately rather than bundled into an unrelated change.
#
# read/write_online_store_navigation: archiving must leave a URL redirect
# instead of a 404. The Dev Dashboard is what actually grants scopes (token
# exchange); this file and wrangler.toml are hygiene.
#
# read_reports (2026-09-05): the console's Traffic quality card reads the
# sessions table through shopifyqlQuery, which requires it. Added in the Dev
# Dashboard the same day; until the merchant accepts it the card shows the
# scope-missing state.
scopes = "write_inventory,read_inventory,read_locations,write_merchant_managed_fulfillment_orders,read_orders,read_products,write_products,read_publications,write_publications,write_draft_orders,read_customers,read_shipping,write_shipping,read_markets,write_markets,read_online_store_navigation,write_online_store_navigation,read_reports"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://pawscout.activepaw.co.uk/auth/callback" ]

[app_proxy]
url = "https://pawscout.activepaw.co.uk/proxy"
subpath = "pawscout"
prefix = "apps"

[webhooks]
api_version = "2026-04"
